name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-windows:
    name: Compile on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Compile e2e binaries
        run: bun run e2e:compile

      - name: Upload e2e artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-out-windows
          path: e2e-out
          if-no-files-found: error

  compile-linux:
    name: Compile on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Compile e2e binaries
        run: bun run e2e:compile

      - name: Upload e2e artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-out-linux
          path: e2e-out
          if-no-files-found: error

  run-windows:
    name: Run on Windows (compile-on-windows and compile-on-linux)
    runs-on: windows-latest
    needs: [compile-windows, compile-linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Download windows-compiled artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-out-windows
          path: compile-windows

      - name: Download linux-compiled artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-out-linux
          path: compile-linux

      - name: Run binaries compiled on Windows (windows-x86-64)
        run: bun run ./tests/e2e/run.ts compile-windows/e2e-out/windows-x86-64 compile-windows/e2e-out/expected

      - name: Run binaries compiled on Linux (windows-x86-64)
        run: bun run ./tests/e2e/run.ts compile-linux/e2e-out/windows-x86-64 compile-linux/e2e-out/expected

  run-linux:
    name: Run on Linux (compile-on-linux and compile-on-windows)
    runs-on: ubuntu-latest
    needs: [compile-windows, compile-linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Download linux-compiled artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-out-linux
          path: compile-linux

      - name: Download windows-compiled artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-out-windows
          path: compile-windows

      - name: Run binaries compiled on Linux (linux-x86-64)
        run: bun run ./tests/e2e/run.ts compile-linux/e2e-out/linux-x86-64 compile-linux/e2e-out/expected

      - name: Run binaries compiled on Windows (linux-x86-64)
        run: bun run ./tests/e2e/run.ts compile-windows/e2e-out/linux-x86-64 compile-windows/e2e-out/expected
